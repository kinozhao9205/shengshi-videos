<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0a0e1a">
  <title data-i18n="title">盛世推廣案例視頻集 · 北京盛世前程</title>
  <meta name="description" data-i18n-attr="content" data-i18n-attr-key="metaDesc" content="盛世推廣案例視頻集 — 覆蓋盛世實力、體驗營銷、品牌合集、海外營銷、創新展具、AI創意六大內容矩陣">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 科技網格背景 -->
  <div class="grid-bg"></div>
  <div class="scan-line"></div>

  <!-- 頂部導航 -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="scrollToTop()">
        <img src="logo-white.png" alt="SHENGSHI HEYDAY GROUP" class="brand-logo">
      </div>

      <div class="topbar-search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索視頻 / 品牌..." autocomplete="off">
      </div>
    </div>
  </header>

  <!-- Hero 區域 -->
  <section class="hero" id="hero">
    <div class="hero-bg-glow"></div>
    <div class="hero-content">
      <div class="hero-badge">
        <span class="hero-logo-label">北京盛世前程 · 北京品牌策劃領跑者</span>
      </div>
      <h1 class="hero-title">
        <span class="title-line-1" data-i18n="heroLine1">盛世推廣案例視頻集</span>
        <span class="title-line-2" data-i18n="heroLine2">Strategy · Experience · Global</span>
      </h1>
      <p class="hero-desc" data-i18n="heroDesc">體系化營銷平臺 · 覆蓋實力展示 / 體驗營銷 / 品牌合集 / 海外營銷 / 創新展具 / AI創意 六大內容矩陣</p>

      <!-- 語言切換（Hero 顯眼位置） -->
      <div class="hero-langs" id="heroLangs" role="group" aria-label="Language">
        <button class="lang-pick" data-lang="zh">中文</button>
        <button class="lang-pick" data-lang="en">English</button>
        <button class="lang-pick" data-lang="ru">Русский</button>
        <button class="lang-pick" data-lang="uz">O'zbekcha</button>
      </div>

      <div class="hero-stats">
        <div class="stat"><span class="stat-num" data-count="30">0</span><span class="stat-label" data-i18n="statVideos">精選視頻</span></div>
        <div class="stat"><span class="stat-num" data-count="6">0</span><span class="stat-label" data-i18n="statCats">內容分類</span></div>
        <div class="stat"><span class="stat-num" data-count="100">0</span><span class="stat-label" data-i18n="statReal">% 真實案例</span></div>
      </div>
    </div>
  </section>

  <!-- 分類篩選 -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-chips" id="filterChips">
      <!-- JS 動態生成 -->
    </div>
  </div>

  <!-- 視頻網格 -->
  <main class="video-grid" id="videoGrid">
    <!-- JS 動態生成 -->
  </main>

  <!-- 空狀態 -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
    <p data-i18n="empty">沒有找到匹配的視頻</p>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <!-- 視頻播放彈窗 -->
  <div class="player-overlay" id="playerOverlay">
    <div class="player-backdrop" id="playerBackdrop"></div>
    <div class="player-modal" id="playerModal">
      <button class="player-close" id="playerClose" aria-label="關閉" data-i18n-attr="aria-label" data-i18n-attr-key="close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="player-wrapper">
        <video id="playerVideo" controls playsinline preload="metadata"
               controlsList="nodownload noremoteplayback"
               disablepictureinpicture
               disableRemotePlayback
               oncontextmenu="return false"
               draggable="false"></video>
      </div>
      <div class="player-info">
        <div class="player-info-head">
          <div class="player-tag" id="playerTag"></div>
          <button class="share-btn" id="playerShareBtn" aria-label="轉發">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            <span data-i18n="share">轉發</span>
          </button>
        </div>
        <h2 class="player-title" id="playerTitle"></h2>
        <p class="player-desc" id="playerDesc"></p>
      </div>
    </div>
  </div>

  <!-- 浮動語言切換（滾動時隨時可見） -->
  <div class="lang-float" id="langFloat" role="group" aria-label="Language">
    <button class="lang-pick" data-lang="zh" title="中文">中文</button>
    <button class="lang-pick" data-lang="en" title="English">EN</button>
    <button class="lang-pick" data-lang="ru" title="Русский">РУС</button>
    <button class="lang-pick" data-lang="uz" title="O'zbekcha">UZ</button>
  </div>

  <!-- 頁腳 -->
  <footer class="site-footer">
    <div class="footer-glow"></div>
    <div class="footer-inner">
      <div class="footer-brand">
        <p data-i18n="footerCompany">北京盛世前程營銷活動策劃有限公司</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 SHENGSHI GROUP. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/videos-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
